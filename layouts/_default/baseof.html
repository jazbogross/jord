<!doctype html>
<html lang="{{ $.Site.Language.Lang }}">

<head>

  {{ block "head" . }}{{end}}

</head>

<body class="{{ if .IsHome }}publication-page{{ else if eq .Section "garden" }}garden-archive-page{{ end }}">

  {{ if .IsHome }}
  <div class="publicationTexture" data-publication-texture aria-hidden="true">
    <img
      class="publicationTextureImage"
      data-publication-texture-image
      src="/images/publication-texture.jpg"
      alt=""
      decoding="async"
      fetchpriority="high">
  </div>
  {{ end }}

  {{ block "topnav" . }}{{end}}

  {{ block "main" . }}{{end}}

</body>

{{ $javascript := resources.Get "js/main.js" | resources.Minify }}
<script src="{{- $javascript.RelPermalink -}}"></script>

</html>
