{{ define "topnav" }}

{{ if eq .Section "garden" }}
<a href="https://naarduikkeerher.dk/roennebaeksholm" aria-label="Rønnebæksholm"><div id="stldiv"></div></a>
<nav id="actionButtons" aria-label="Garden archive navigation">
  <a href="/" class="actionButton">Publication</a>
  <span class="actionButton archiveBadge" aria-current="page">Garden archive</span>
</nav>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.156.1/build/three.module.js';
    import { STLLoader } from 'https://unpkg.com/three@0.156.1/examples/jsm/loaders/STLLoader.js';

    let camera, scene, renderer;
    let geometry, material, mesh;

    const init = () => {
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 10);
      camera.position.z = 1;

      scene = new THREE.Scene();

  const ambientLight = new THREE.AmbientLight(0x999999);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xFFFFFF, 5);
  directionalLight.position.set(1, 1, 1).normalize();
  scene.add(directionalLight);

      const loader = new STLLoader();
loader.load('/lillehaand.stl', (geometry) => {

      geometry.computeVertexNormals();

      const material = new THREE.MeshPhongMaterial({
      color: 0xC0C0C0,
      specular: 0x111111,
      shininess: 100
    });

    mesh = new THREE.Mesh(geometry, material);


  geometry.computeBoundingBox();
  const boundingBox = geometry.boundingBox;
  
  const maxAxis = Math.max(
    boundingBox.max.x - boundingBox.min.x,
    boundingBox.max.y - boundingBox.min.y,
    boundingBox.max.z - boundingBox.min.z
  );

  const scale = 0.8 / maxAxis;
  mesh.scale.set(scale, scale, scale);

  scene.add(mesh);
});


      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(200, 200);
      document.getElementById('stldiv').appendChild(renderer.domElement);



    }

    const animate = () => {
      requestAnimationFrame(animate);

      if (mesh) {
        mesh.rotation.x += 0.005;
        mesh.rotation.y += 0.005;
      }

      renderer.render(scene, camera);
    }

    init();
    animate();

</script>
{{ else if .IsHome }}
<nav id="publicationNav" aria-label="Publication navigation">
  <a href="/garden/">Garden archive</a>
</nav>
{{ end }}

{{ end }}
